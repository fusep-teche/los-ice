name: LineageOS 22.2 build (Xiaomi ice)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghc /usr/local/share/boost /usr/local/share/graalvm \
            /usr/lib/jvm /opt/hostedtoolcache
          sudo docker image prune -af || true
          sudo apt-get clean
          df -hT /

      - name: Create swap
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Create 75G btrfs build volume (zstd compression)
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs
          sudo truncate -s 75G /build.img
          sudo mkfs.btrfs -f /build.img
          sudo mount -o compress=zstd:15,loop /build.img "$GITHUB_WORKSPACE"
          sudo chown -R runner:runner "$GITHUB_WORKSPACE"
          df -hT "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: |
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg jq libarchive-tools \
            libelf-dev libssl-dev lz4 mtools ninja-build openjdk-17-jdk-headless \
            python3-filelock python3-pip rsync squashfs-tools unzip xmlstarlet \
            xsltproc zip zlib1g-dev
          mkdir -p "$HOME/.local/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/.local/bin/repo"
          chmod a+x "$HOME/.local/bin/repo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync sources
        run: |
          git config --global user.name "ROM Builder"
          git config --global user.email "builder@example.com"
          cd "$GITHUB_WORKSPACE"
          repo init -u https://github.com/LineageOS/android.git -b lineage-22.2 --depth=1
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/ice.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="jagatg" fetch="https://github.com/" />
            <project name="Jagatg/android_device_xiaomi_ice" path="device/xiaomi/ice" remote="jagatg" revision="lineage-22.2" />
            <project name="Jagatg/proprietary_android_device_xiaomi_ice" path="vendor/xiaomi/ice" remote="jagatg" revision="lineage-22.2" />
            <project name="Jagatg/android_hardware_mediatek" path="hardware/mediatek" remote="jagatg" revision="17.0" />
            <project name="Jagatg/device_mediatek_sepolicy_vndr" path="device/mediatek/sepolicy_vndr" remote="jagatg" revision="lineage-19.1" />
          </manifest>
          EOF
          repo sync -c -j8 --no-tags

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE"
          source build/envsetup.sh
          breakfast ice
          mka bacon WITH_DEXPREOPT=false

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: lineage-22.2-ice
          path: out/target/product/ice/lineage-22.2-*-UNOFFICIAL-ice.zip

      - name: Upload fastboot images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ice-fastboot-images
          path: |
            out/target/product/ice/boot.img
            out/target/product/ice/dtbo.img
            out/target/product/ice/vbmeta.img
            out/target/product/ice/vbmeta_system.img
            out/target/product/ice/vbmeta_vendor.img
          if-no-files-found: warn
