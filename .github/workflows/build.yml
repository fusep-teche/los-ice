name: LineageOS 22.2 (Redmi A1+ / ice)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Setup disk space (compressed btrfs)
        run: |
          set -e
          # чистим мусор раннера
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /var/lib/docker 2>/dev/null || true
          sudo apt-get remove -y --purge azure-cli google-chrome-stable firefox microsoft-edge-stable 2>/dev/null || true
          sudo apt-get install -y btrfs-progs
          if sudo modprobe btrfs 2>/dev/null && [ -e /dev/btrfs-control -o "$(grep -c btrfs /proc/filesystems)" != "0" ]; then
            echo "BTRFS supported, creating compressed volume"
            sudo truncate -s 75G /build.img
            sudo mkfs.btrfs -q /build.img
            sudo mount -o compress=zstd:15,noatime /build.img $GITHUB_WORKSPACE
            sudo chown -R runner:runner $GITHUB_WORKSPACE
            echo "BTRFS=yes" >> $GITHUB_ENV
            # дополнительный swap
            sudo fallocate -l 8G /mnt/swap2 && sudo chmod 600 /mnt/swap2
            sudo mkswap /mnt/swap2 && sudo swapon /mnt/swap2 || true
          else
            echo "No btrfs, will use fallback"
            echo "BTRFS=no" >> $GITHUB_ENV
          fi
          df -h /

      - name: Maximize disk space (fallback)
        if: env.BTRFS != 'yes'
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 128
          swap-size-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig rsync wget

      - name: Init and sync sources
        run: |
          cd $GITHUB_WORKSPACE
          git config --global user.email "builder@users.noreply.github.com"
          git config --global user.name "builder"
          sudo curl -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+x /usr/local/bin/repo
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/ice.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="jagatg" fetch="https://github.com/" />
            <project name="Jagatg/android_device_xiaomi_ice" path="device/xiaomi/ice" remote="jagatg" revision="lineage-22.2" />
          </manifest>
          EOF
          repo init -u https://github.com/LineageOS/android.git -b lineage-22.2 --depth=1
          for i in 1 2 3; do repo sync -c --no-tags --no-clone-bundle -j8 --fail-fast && break; sleep 10; done
          df -h .
          du -sh . 2>/dev/null || true

      - name: Build
        run: |
          cd $GITHUB_WORKSPACE
          source build/envsetup.sh
          breakfast ice
          mka bacon WITH_DEXPREOPT=false
          df -h .
          ls -lh out/target/product/ice/*.zip || true

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: lineage-22.2-ice
          path: out/target/product/ice/lineage-*.zip

      - name: Upload fastboot images
        uses: actions/upload-artifact@v4
        with:
          name: ice-fastboot-images
          path: |
            out/target/product/ice/boot.img
            out/target/product/ice/dtbo.img
            out/target/product/ice/vbmeta*.img
